spring:
  application:
    name: server
  datasource:
    url: jdbc:mysql://db-hivibe.c5cugcucm1fh.ap-northeast-2.rds.amazonaws.com:3306/hivibe?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: seongha
    password: rhdiddlrkwlrnfmfrngksek04!
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update            # 운영 시 validate, 개발 시 update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true          # SQL 줄바꿈 포맷
        show_sql: true           # SQL 콘솔 출력 (개발 시 true)
    open-in-view: false           # OSIV 비활성화 (권장)

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            scope:
              - profile_nickname
              - account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  secret: ${JWT_SECRET}           # 256bit 이상 랜덤 문자열
  access-expiration: 1800000      # 30분 (ms)
  refresh-expiration: 1209600000  # 14일 (ms)

server:
  port: 8080

